<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EZEapply · Job Filters preview</title>
    <script src="/native-api.js"></script>
    <script defer src="/job-filters-preview.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #182320;
        color: #e9f1ed;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 25px 20px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 25px;
      }
      .card-title {
        margin: 0 30px 4px 0;
        font-size: 16px;
        font-weight: 700;
        color: #e9f1ed;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      p {
        margin: 0;
        color: #b3c2ba;
      }
      output {
        display: block;
        margin: 20px 0 9px;
        color: #9be0c4;
        font-weight: 650;
      }
      article {
        position: relative;
        padding: 13px 14px;
        border-bottom: 1px solid #344d44;
      }
      #results {
        overflow: hidden;
        border: 1px solid #344d44;
        border-radius: 12px;
        background: #21302b;
      }
      article:last-child {
        border-bottom: 0;
      }
      article.dismissed > [role='button'] {
        opacity: 0.4;
      }
      .dismissed-caption {
        margin-top: 5px;
        font-size: 12px;
      }
      button {
        padding: 6px 10px;
        color: inherit;
        font: inherit;
        border: 1px solid #4a695d;
        border-radius: 7px;
        background: #2a4238;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #9be0c4;
        outline-offset: 2px;
      }
      .card-action {
        position: absolute;
        right: 10px;
        top: 10px;
        padding: 0;
        width: 28px;
        height: 28px;
      }
      .pages {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .pages button[aria-current] {
        color: #132a20;
        background: #9be0c4;
      }
      iframe {
        display: block;
        width: 100%;
        height: 586px;
        border: 1px solid #344d44;
        border-radius: 14px;
      }
      @media (max-width: 765px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        iframe {
          max-width: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-label="Sample job search">
        <h1>Job Filters preview</h1>
        <p>
          Try <strong>Data Engineer</strong> under Job titles and <strong>Jobgether</strong> under
          Job companies.
        </p>
        <output aria-live="polite"></output>
        <div
          id="results"
          componentkey="SearchResultsMainContent"
          aria-label="Example job results"
        ></div>
        <nav class="pages" aria-label="Example result pages">
          <button type="button" data-page="0">Page 1</button>
          <button type="button" data-page="1">Page 2</button>
        </nav>
      </section>
      <iframe title="EZEapply popup" src="/popup.html"></iframe>
    </main>
  </body>
</html>
