<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Embedded application fields</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 18px;
        background: white;
        color: #344357;
        font:
          12px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 5px;
      }
      input {
        font: inherit;
        padding: 9px;
        border: 1px solid #bdcbd9;
        border-radius: 6px;
        width: 100%;
        min-width: 0;
      }
      p {
        font-size: 10px;
        color: #6b7d91;
      }
      @media (max-width: 400px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="/demo-api.js"></script>
    <script defer src="/custom/content.js"></script>
  </head>
  <body>
    <h2>Embedded application fields</h2>
    <div class="grid">
      <label>Email address<input id="frame-email" type="email" autocomplete="email" /></label
      ><label>City<input id="frame-city" autocomplete="address-level2" /></label>
    </div>
    <p>These controls belong to a separate frame and require frame-aware dispatch.</p>
  </body>
</html>
