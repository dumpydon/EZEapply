<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EZEapply · Test workspace</title>
    <link rel="stylesheet" href="/custom/theme.css" />
    <link rel="icon" href="/custom/icon/32.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #151c25;
        color: #eef1f7;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      header {
        padding: 18px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        border-bottom: 1px solid #354051;
        background: #202b32;
      }
      header img {
        width: 32px;
        height: 32px;
      }
      header b {
        font-size: 16px;
      }
      header small {
        color: #b4becd;
      }
      header span {
        background: #415f79;
        color: #e2deff;
        font-size: 10px;
        letter-spacing: 0.1em;
        border: 1px solid #668f9c;
        padding: 3px 8px;
        border-radius: 5px;
      }
      main {
        height: calc(100dvh - 68px);
        display: grid;
        grid-template-columns: minmax(300px, 390px) 1fr;
        gap: 1px;
        background: #354051;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: #202830;
      }
      #application {
        background: #f4f5f9;
      }
      @media (max-width: 700px) {
        header {
          padding: 12px;
          flex-wrap: wrap;
          gap: 5px 12px;
        }
        header small {
          width: 100%;
          font-size: 11px;
        }
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        iframe {
          height: 900px;
        }
        #application {
          height: 1100px;
        }
      }
    </style>
    <script src="/demo-api.js"></script>
  </head>
  <body>
    <header>
      <img src="/custom/icon/128.png" alt="Local extension logo" /><b>EZEapply</b
      ><span>LOCAL TEST</span
      ><small>Working module · Synthetic profile · No applications are submitted</small
      ><button id="preview-show-panel" hidden>Show EZEapply panel</button>
    </header>
    <main>
      <iframe
        id="panel"
        title="Custom fields side panel"
        src="/panel.html"
        allow="clipboard-write"
      ></iframe
      ><iframe id="application" title="Application test form" src="/apply/form.html"></iframe>
    </main>
  </body>
</html>
